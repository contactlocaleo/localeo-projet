<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Localeo Pro — maquette isolée</title><link rel="stylesheet" href="prototype.css"></head><body><a class="skip" href="#main">Aller au contenu</a><div class="demo"><strong>MAQUETTE APRÈS · <span id="demo-id"></span></strong> — scénario illustratif, aucune action réelle.</div><header class="topbar"><div class="brand"><img src="assets/header-mark.svg" alt=""><div><div class="wordmark">Localeo <em>Pro</em></div><div class="test">TEST</div></div></div><button class="iconbtn" aria-label="Installer l’application">↓</button><button class="iconbtn" aria-label="Mon compte">C</button></header><div class="layout"><aside class="sidebar" aria-label="Navigation principale"></aside><main id="main"></main></div><nav class="nav" aria-label="Navigation principale mobile"></nav><div id="toast" class="toast" role="status" hidden></div><script src="scenarios.js"></script><script>
const key=new URLSearchParams(location.search).get('etat')||'b1-erreur';const state=states[key]||states['b1-erreur'];document.title=state.title+' — maquette Localeo Pro';document.getElementById('demo-id').textContent=key.toUpperCase();document.getElementById('main').innerHTML=state.html+'<footer class="footer">Dates et heures : heure de Paris (été/hiver).</footer>';
const icons=['<path d="m3 10 9-7 9 7v11h-6v-7H9v7H3Z"/>','<path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5M7 12h10"/>','<rect x="3" y="5" width="18" height="16" rx="1"/><path d="M3 10h18M8 2v6m8-6v6"/>','<path d="M4 6h16M4 12h16M4 18h16"/>'];const dest=['d1-accueil','b1-scan','d1-pret','c1-notifications'];const labels=['Accueil','Scanner','Animations','Plus'];const nav=labels.map((name,i)=>'<a '+(i===state.nav?'class="active" aria-current="page"':'')+' href="?etat='+dest[i]+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">'+icons[i]+'</svg>'+name+'</a>').join('');document.querySelector('.nav').innerHTML=nav;document.querySelector('.sidebar').innerHTML=nav;
const sidebar=document.querySelector('.sidebar');sidebar.innerHTML='<p class="eyebrow">Au quotidien</p>'+nav.replace(/<a [^>]*href="\?etat=c1-notifications"[^>]*>[\s\S]*?<\/a>/,'')+'<a href="?etat=d1-incomplet">Préparation des animations</a><hr><p class="eyebrow">Mon commerce</p><button>Ma page publique</button><hr><p class="eyebrow">Mon espace</p><button>Réglages</button><button>Compte</button><button>Accès salariés</button><button>Historique des validations</button><button>Validation par PIN</button><a href="?etat=c1-notifications">Notifications</a><button>Aide et contact</button>';
document.addEventListener('click',e=>{if(e.target.closest('button')){const toast=document.getElementById('toast');toast.hidden=false;toast.textContent='Démonstration visuelle : aucune action envoyée.';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>toast.hidden=true,3500)}});
</script></body></html>
