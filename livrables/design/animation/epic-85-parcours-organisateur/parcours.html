<div id="localeo-parcours" lang="fr">

<style>
#localeo-parcours{--bleu:#0b314d;--navy:#103f60;--orange:#a94d0b;--paper:#fff;--sand:#f6f5f1;--line:#d9e1e5;--muted:#4e6574;background:var(--sand);color:var(--bleu);font:14px/1.5 system-ui,"Segoe UI",sans-serif;container-type:inline-size;border:1px solid #d3dadc;border-radius:10px;overflow:hidden;color-scheme:light}
#localeo-parcours *{box-sizing:border-box}#localeo-parcours [hidden]{display:none!important}
#localeo-parcours :is(button,input,select){font:inherit;color:inherit}#localeo-parcours button{cursor:pointer}#localeo-parcours button:disabled{cursor:default;opacity:.5}
#localeo-parcours :is(button,input,select):focus-visible,#localeo-parcours [tabindex="-1"]:focus-visible{outline:3px solid #cf6822;outline-offset:2px}
#localeo-parcours .bar{display:flex;gap:18px;align-items:center;color:white;background:#092b43;padding:13px clamp(14px,3vw,35px)}
#localeo-parcours .bar strong{font-size:20px;letter-spacing:-.6px}#localeo-parcours .bar em{font-style:normal;color:#ffae65}#localeo-parcours .bar span{font-size:13px;border-left:1px solid #74909c;padding-left:18px}#localeo-parcours .bar small{margin-left:auto;color:#e7eff2}

#localeo-parcours :is(h1,h2,h3,p){margin:0;color:inherit}#localeo-parcours h1{font-size:clamp(23px,3vw,34px);letter-spacing:-.8px;line-height:1.17}
#localeo-parcours h2{font-size:21px;line-height:1.26;letter-spacing:-.3px}#localeo-parcours .sub{margin-top:5px;color:var(--muted)}
#localeo-parcours .group{margin-top:22px}#localeo-parcours .group h2{font-size:16px;margin-bottom:8px}
#localeo-parcours .catalog{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}
#localeo-parcours .model{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 16px;padding:15px 18px;border:0;text-align:left;background:white;color:var(--bleu)}
#localeo-parcours .model:hover{background:#fdf5eb}#localeo-parcours .model:focus-visible{outline-offset:-3px}
#localeo-parcours .model b{font-size:16px}#localeo-parcours .model small{color:var(--muted);font-size:13px;grid-column:1}#localeo-parcours .arrow{grid-column:2;grid-row:1/3;font-size:20px;color:var(--orange)}
#localeo-parcours .crumbs{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:12px;color:var(--muted);font-size:13px}#localeo-parcours .textbutton{border:0;background:transparent;color:var(--navy);padding:4px 0;text-decoration:underline;text-underline-offset:3px}
#localeo-parcours .frame{background:white;border:1px solid var(--line);border-radius:9px;overflow:hidden}
#localeo-parcours .steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));padding:0;border-bottom:1px solid var(--line);background:#fafbf9}
#localeo-parcours .step{background:transparent;border:0;border-bottom:3px solid transparent;display:flex;gap:6px;justify-content:center;align-items:center;padding:15px 2px;color:var(--muted);font-size:13px}
#localeo-parcours .step span{display:grid;place-items:center;border:1px solid #9baeb7;border-radius:100%;height:21px;min-width:21px;font-size:12px}
#localeo-parcours .step[aria-current]{background:#fcf1e6;border-color:var(--orange);font-weight:700;color:#823b0a}#localeo-parcours .step[aria-current] span{background:#994509;border-color:#994509;color:white}
#localeo-parcours .step:focus-visible{outline-offset:-4px}#localeo-parcours .name{margin:0 0 17px}
#localeo-parcours .inner{padding:clamp(14px,2vw,25px)}#localeo-parcours .phase{color:var(--orange);font-size:12px;font-weight:650;margin-bottom:5px}
#localeo-parcours .brief{max-width:85ch;margin-top:6px;color:var(--muted)}
#localeo-parcours .metrics{display:flex;flex-wrap:wrap;gap:12px 0;margin:18px 0;padding:13px 0;border-block:1px solid var(--line)}
#localeo-parcours .measure{padding:0 20px;border-right:1px solid var(--line);min-width:110px}#localeo-parcours .measure:first-child{padding-left:0}#localeo-parcours .measure:last-child{border-right:0}
#localeo-parcours .measure b{display:block;font-size:22px;line-height:1.2;font-variant-numeric:tabular-nums}#localeo-parcours .measure small{color:var(--muted);font-size:12px}
#localeo-parcours .tools,#localeo-parcours .controls{display:flex;align-items:end;flex-wrap:wrap;gap:10px}#localeo-parcours .tools{margin-bottom:12px}
#localeo-parcours .tools label{display:grid;gap:3px;font-size:12px;font-weight:620}#localeo-parcours .tools :is(select,input){height:36px;padding:5px 8px;background:white;border:1px solid #9fb0bc;border-radius:5px;max-width:100%}
#localeo-parcours .grid{width:100%;border-collapse:collapse;text-align:left}#localeo-parcours .grid :is(th,td){padding:10px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}#localeo-parcours .grid th{background:#edf2f4;font-size:12px}#localeo-parcours .grid td{font-size:13px}#localeo-parcours .grid td:first-child{font-weight:600}
#localeo-parcours .pager{display:flex;gap:7px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:12px;margin:10px 0}#localeo-parcours .count{margin-right:auto}
#localeo-parcours .btn{border:1px solid #b5c3ca;border-radius:6px;padding:8px 12px;background:white;font-weight:600}
#localeo-parcours .btn:hover:enabled{background:#f1f5f7}#localeo-parcours .primary{background:var(--navy);border-color:var(--navy);color:white}#localeo-parcours .primary:hover:enabled{background:var(--bleu)}
#localeo-parcours .controls{margin-top:18px;align-items:center}#localeo-parcours .receipt{padding:14px 16px;margin-top:16px;border-left:3px solid #2d7263;background:#edf7f2}
#localeo-parcours .check{padding:14px 16px;background:#fff6e9;border-left:3px solid var(--orange);margin-top:16px}#localeo-parcours .check p{margin:3px 0 9px;color:var(--muted)}
#localeo-parcours .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}#localeo-parcours .empty{padding:14px;background:#f7f9fa}#localeo-parcours .compact{font-size:12px}
@container(max-width:700px){#localeo-parcours .steps{grid-template-columns:repeat(3,minmax(0,1fr))}#localeo-parcours .step{padding:9px 2px}#localeo-parcours .catalog{grid-template-columns:1fr}}
@container(max-width:500px){#localeo-parcours .bar{gap:9px;padding:10px 12px}#localeo-parcours .bar span{padding-left:9px}#localeo-parcours .bar small{font-size:10px}#localeo-parcours .step{min-height:44px;font-size:12px;gap:3px}#localeo-parcours .inner{padding:12px}#localeo-parcours .measure{min-width:0;padding:0 8px;flex:1}#localeo-parcours .measure b{font-size:18px}#localeo-parcours .measure small{font-size:11px}#localeo-parcours :is(.btn,.tools select,.tools input,.textbutton){min-height:44px}#localeo-parcours .grid thead{position:absolute;clip-path:inset(50%);width:1px;height:1px;overflow:hidden}#localeo-parcours .grid,#localeo-parcours .grid tbody,#localeo-parcours .grid tr{display:block}#localeo-parcours .grid tr{padding:8px 0;border-bottom:1px solid var(--line)}#localeo-parcours .grid td{display:grid;grid-template-columns:minmax(64px,34%) 1fr;gap:10px;border:0;padding:3px 0}#localeo-parcours .grid td:before{content:attr(data-col);color:var(--muted);font-weight:400;font-size:12px}#localeo-parcours .pager .count{width:100%}#localeo-parcours .tools label{width:100%}#localeo-parcours .controls .btn{width:100%;text-align:center}}
</style>

const root=document.getElementById('localeo-parcours');
const main=root.querySelector('main');
const status=root.querySelector('[role=status]');
const models=[...participation,...terrain,...futurs];
const stages=['Préparation','Publication','Suivi','Clôture','Tirage','Bilan'];
const standard=m=>!futurs.includes(m);
const commands=[
  null,
  ['Publier l’animation','La fiche et les supports de cette édition seront publiés.'],
  null,
  ['Clôturer l’animation','Les inscriptions et les validations seront fermées. La population éligible sera figée.'],
  ['Préparer le tirage','Le tirage attribuera les lots de cette édition aux participants de la liste figée.'],
  null
];
for(const m of models){
  m.steps.forEach((s,i)=>{
    const command=commands[i];
    if(command && s.action.startsWith('Confirmer')){
      s.confirmLabel=s.action;
      [s.action,s.confirmText]=command;
    }
  });
}
const summaries={
  passeport:'Passages dans des commerces distincts et seuil de qualification.',
  'tombola-locale':'Premier achat validé en commerce et chance unique au tirage.',
  'tombola-publique':'Inscription directe depuis une affiche ou un lien public.',
  chasse:'Récit, missions des commerces et supports des lieux publics.',
  prix:'Produits, prix de référence et estimations des participants.',
  vitrines:'Intrus en vitrine, installations et reprise après incident.',
  'mots-croises':'Version de grille, fiches indices et passages chez les commerçants.',
  avent:'Cases quotidiennes, participations et tirage propre à chaque journée.',
  'escape-game':'Contrôle du scénario, progression dans les énigmes et réussite de la mission.'
};
const records=new Map();
let model=null,stage=0,confirming=false;
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const button=(action,label,cls='btn',attrs='')=>'<button type="button" class="'+cls+'" data-action="'+action+'" '+attrs+'>'+esc(label)+'</button>';
const current=()=>model.steps[stage];
function state(){
  const key=model.id+'/'+stage;
  if(!records.has(key))records.set(key,{done:false,q:'',filter:'',page:0});
  return records.get(key);
}
function catalogue(focusId){
  model=null;confirming=false;status.textContent='';
  function group(title,items){
    return '<section class="group"><h2>'+title+'</h2><div class="catalog">'+items.map(m=>'<button type="button" class="model" data-model="'+m.id+'"><b>'+esc(m.name)+'</b><small>'+esc(summaries[m.id])+'</small><span class="arrow" aria-hidden="true">→</span></button>').join('')+'</div></section>';
  }
  main.innerHTML='<h1>Parcours des animations</h1><p class="sub">Choisissez une animation pour parcourir ses écrans de gestion. Les éditions et les actions sont simulées.</p>'+group('Modèles du catalogue standard',models.filter(m=>!futurs.includes(m)))+group('Modèles en projet',futurs);
  if(focusId)main.querySelector('[data-model="'+focusId+'"]')?.focus();
}
function openStage(n,focus){
  stage=n;confirming=false;status.textContent='';
  const labels=model.id==='escape-game'?['Préparation','Publication','Suivi','Clôture','Résultats','Bilan']:stages;
  const s=current(), r=state(), states=[...new Set(s.rows.map(row=>row[2]))];
  const canFilter=states.length>1 && states.length<s.rows.length;
  main.innerHTML='<div class="crumbs">'+button('home','← Tous les modèles','textbutton')+'<span aria-hidden="true">/</span>'+esc(model.name)+(futurs.includes(model)?' · Modèle en projet':'')+'</div><h1 class="name">'+esc(model.title)+'</h1>'+
  '<section class="frame"><nav class="steps" aria-label="Écrans du parcours">'+labels.map((l,i)=>'<button type="button" class="step" data-stage="'+i+'" '+(i===n?'aria-current="page"':'')+'><span aria-hidden="true">'+(i+1)+'</span>'+l+'</button>').join('')+'</nav><section class="inner"><div class="phase">'+esc(labels[n])+' · Écran '+(n+1)+' sur 6</div><h2 tabindex="-1">'+esc(s.title)+'</h2><p class="brief">'+esc(s.lead)+'</p><div class="snapshot"><div class="metrics">'+s.metrics.map(([value,label])=>'<div class="measure"><b>'+esc(value)+'</b><small>'+esc(label)+'</small></div>').join('')+'</div>'+
  '<div class="tools" '+(s.rows.length>4||canFilter?'':'hidden')+'>'+(s.rows.length>4?'<label>Rechercher dans la liste<input type="search" data-query value="'+esc(r.q)+'"></label>':'')+(canFilter?'<label>'+esc(s.columns[2])+'<select data-filter><option value="">Tout afficher</option>'+states.map(v=>'<option '+(r.filter===v?'selected':'')+'>'+esc(v)+'</option>').join('')+'</select></label>':'')+'</div>'+
  '<div class="results"></div><div class="pager"><span class="count" aria-live="polite"></span><div class="controls-page">'+button('first','Première page','btn compact')+' '+button('prev','Précédente','btn compact')+' '+button('nextPage','Suivante','btn compact')+'</div></div></div>'+
  '<div class="actionbox"></div></section></section>';
  updateList();updateAction();
  if(focus)main.querySelector('h2').focus({preventScroll:true});
}
function updateList(){
  const s=current(),r=state();
  const normalize=v=>String(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('fr');
  const list=s.rows.filter(row=>(!r.filter||row[2]===r.filter)&&row.some(v=>normalize(v).includes(normalize(r.q.trim()))));
  const pageCount=Math.max(1,Math.ceil(list.length/4));r.page=Math.min(r.page,pageCount-1);
  const shown=list.slice(r.page*4,r.page*4+4);
  main.querySelector('.results').innerHTML=shown.length?'<table class="grid" aria-label="'+esc(s.title)+'"><thead><tr>'+s.columns.map(v=>'<th scope="col">'+esc(v)+'</th>').join('')+'</tr></thead><tbody>'+shown.map(row=>'<tr>'+row.map((v,i)=>'<td data-col="'+esc(s.columns[i])+'">'+esc(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table>':'<p class="empty">Aucun résultat pour ces critères.</p>';
  main.querySelector('.count').textContent=list.length+' résultat'+(list.length>1?'s':'')+(pageCount>1?' · Page '+(r.page+1)+' sur '+pageCount:'');
  main.querySelector('.controls-page').hidden=pageCount<=1;
  for(const [a,off] of [['first',r.page===0],['prev',r.page===0],['nextPage',r.page>=pageCount-1]]){
    const b=main.querySelector('[data-action="'+a+'"]');b.setAttribute('aria-disabled',String(off));b.style.opacity=off?'.45':'1';
  }
}
function updateAction(){
  const s=current(),r=state(),box=main.querySelector('.actionbox');
  main.querySelector('.snapshot').hidden=r.done;
  main.querySelector('.brief').hidden=r.done;
  const next=stage<5?button('forward',s.next||stages[stage+1],r.done?'btn primary':'textbutton'):button('home','Revenir aux modèles',r.done?'btn primary':'textbutton');
  if(r.archivePrompt){box.innerHTML='<section class="check"><strong>Archiver cette édition terminée ?</strong><p>Elle restera consultable dans Mes archives avec son bilan.</p>'+button('archive','Confirmer l’archivage','btn primary')+' '+button('cancelArchive','Annuler')+'</section>';return}
  if(r.archived){box.innerHTML='<div class="receipt" role="status">Édition archivée. Le bilan est conservé dans Animations → Mes archives.</div><div class="controls">'+button('home','Revenir aux modèles','btn primary')+' '+button('replay','Revoir le bilan','textbutton')+'</div>';return}
  if(r.done && stage===4 && standard(model)){
    if(r.finished){box.innerHTML='<div class="receipt" role="status">Édition terminée. Le bilan est disponible.</div><div class="controls">'+button('forward','Consulter le bilan','btn primary')+'</div>';return}
    if(r.settled){box.innerHTML='<section class="check"><strong>Terminer l’animation ?</strong><p>Dans cet exemple, tous les dossiers de gain ont désormais été résolus. Terminer fige la gestion et ouvre le bilan.</p>'+button('finish','Terminer l’animation','btn primary')+' '+button('cancelFinish','Retour aux attributions')+'</section>';return}
    box.innerHTML='<div class="receipt" role="status">'+esc(s.effect)+'</div><div class="controls">'+button('settled','Voir la fin après résolution des dossiers','btn primary')+' '+button('replay','Revoir le tirage','textbutton')+'</div>';return
  }
  if(r.done){box.innerHTML='<div class="receipt" role="status">'+esc(s.effect)+'</div><div class="controls">'+(stage===5&&standard(model)?button('archivePrompt','Archiver l’édition terminée','btn primary')+' '+button('home','Revenir aux modèles','textbutton'):next)+' '+button('replay','Revoir cet écran','textbutton')+'</div>';return}
  if(confirming){box.innerHTML='<section class="check"><strong>'+esc(s.action)+' ?</strong><p>'+esc(s.confirmText||'Confirmez cette action pour cette édition de démonstration.')+'</p>'+button('commit',s.confirmLabel||s.action,'btn primary')+' '+button('cancel','Annuler')+'</section>';return}
  box.innerHTML='<div class="controls">'+button('act',s.action,'btn primary')+'</div>';
}
root.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||b.getAttribute('aria-disabled')==='true')return;
  if(b.dataset.model){model=models.find(m=>m.id===b.dataset.model);openStage(0,true);return}
  if(b.dataset.stage!==undefined){openStage(Number(b.dataset.stage),true);return}
  const a=b.dataset.action;
  if(a==='home'){catalogue(model.id);return}
  if(a==='forward'){openStage(stage+1,true);return}
  const r=state();
  if(['first','prev','nextPage'].includes(a)){r.page=a==='first'?0:r.page+(a==='prev'?-1:1);updateList();return}
  if(a==='settled'){r.settled=true}
  else if(a==='cancelFinish'){r.settled=false}
  else if(a==='finish'){r.settled=false;r.finished=true;openStage(5,true);return}
  else if(a==='archivePrompt'){r.archivePrompt=true}
  else if(a==='archive'){r.archived=true;r.archivePrompt=false}
  else if(a==='cancelArchive'){r.archivePrompt=false}
  else if(a==='act'&&current().confirmLabel){confirming=true}
  else if(a==='act'||a==='commit'){r.done=true;confirming=false}
  else if(a==='cancel'){confirming=false}
  else if(a==='replay'){r.done=false;r.archived=false;r.settled=false}
  updateAction();main.querySelector('.actionbox button')?.focus({preventScroll:true});
});
root.addEventListener('input',e=>{if(e.target.matches('[data-query]')){state().q=e.target.value;state().page=0;updateList()}});
root.addEventListener('change',e=>{if(e.target.matches('[data-filter]')){state().filter=e.target.value;state().page=0;updateList()}});
catalogue();
})();
</script>
</body></html>
