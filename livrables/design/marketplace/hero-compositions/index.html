<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Localeo — 3 directions pour le hero</title>
<style>
@font-face{font-family:DM;src:url('../../../../../localeo-marketplace/node_modules/@fontsource-variable/dm-sans/files/dm-sans-latin-wght-normal.woff2');font-weight:100 1000;font-display:swap}*{box-sizing:border-box}body{margin:0;background:#e5e7e7;color:#082840;font-family:DM,system-ui,sans-serif}header{padding:19px 28px 0;background:#f6f5f1;border-bottom:1px solid #d7d9d8}.top{display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:16px;margin:0;font-weight:750}h1 span{font-weight:400;color:#586873;margin-left:15px;font-size:12px}.tools{display:flex;align-items:center;gap:8px}button,a{font:inherit;font-size:12px;color:inherit}button{border:0;cursor:pointer;background:transparent;min-height:44px;padding:10px 14px}button[aria-pressed=true]{background:#082840;color:#fff}.tools a{margin-left:12px;text-underline-offset:4px}nav{display:flex;gap:25px;margin-top:10px}nav button{border-bottom:3px solid transparent;padding:14px 0;font-weight:600}nav button[aria-pressed=true]{background:transparent;color:#082840;border-color:#f28a2e}nav button span{opacity:.6;margin-right:9px}.description{font-size:12px;line-height:1.5;margin:0;padding:12px 28px;background:#f6f5f1;color:#586873}.stage{padding:20px;display:flex;justify-content:center}iframe{width:100%;height:calc(100svh - 182px);min-height:720px;border:0;background:#f6f5f1;box-shadow:0 10px 35px #08284010;transition:width .3s}.stage.mobile iframe{width:390px;height:844px;flex-shrink:0}button:focus-visible,a:focus-visible{outline:3px solid #f28a2e;outline-offset:4px}@media(max-width:760px){header{padding:14px 16px 0}.top{align-items:flex-start;flex-direction:column;gap:3px}h1 span{display:block;margin:4px 0 0}.tools{width:100%}.tools a{margin-left:auto}nav{gap:20px;margin-top:2px}nav button{font-size:11px}.description{padding:10px 16px}.stage{padding:10px 0}.stage.mobile iframe{max-width:100%}iframe{height:844px;min-height:740px}}
</style>
</head>
<body>
<header><div class="top"><h1>Localeo <span>Trois directions pour le hero</span></h1><div class="tools" aria-label="Format d’aperçu"><button type="button" id="desktop" aria-pressed="true">Ordinateur</button><button type="button" id="mobile" aria-pressed="false">Mobile</button><a id="open" href="hero.html?v=1" target="_blank" rel="noopener">Plein écran ↗</a></div></div><nav aria-label="Choisir une composition"><button type="button" data-variant="1" aria-pressed="true"><span>01</span>Immersion</button><button type="button" data-variant="2" aria-pressed="false"><span>02</span>Éditorial</button><button type="button" data-variant="3" aria-pressed="false"><span>03</span>À partager</button></nav></header>
<p class="description" id="description" aria-live="polite">Photo immersive, contraste bleu profond et recherche au premier plan. L’accent est mis sur la découverte.</p>
<div class="stage" id="stage"><iframe title="Aperçu du hero : Immersion" src="hero.html?v=1"></iframe></div>
<script>
const descriptions=['Photo immersive, contraste bleu profond et recherche au premier plan. L’accent est mis sur la découverte.','Composition éditoriale, fond crème et photographie lumineuse. L’accent est mis sur les commerçants et la proximité.','Panorama de vie locale et bandeau bleu. L’accent est mis sur le cadeau et les moments à partager.'];
const names=['Immersion','Éditorial','À partager'];
const frame=document.querySelector('iframe');
function select(id){document.querySelectorAll('[data-variant]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.variant===id)));frame.src='hero.html?v='+id;frame.title='Aperçu du hero : '+names[Number(id)-1];document.getElementById('description').textContent=descriptions[Number(id)-1];document.getElementById('open').href=frame.src;history.replaceState(null,'','#'+id);}
document.querySelectorAll('[data-variant]').forEach(button=>button.addEventListener('click',()=>select(button.dataset.variant)));
['desktop','mobile'].forEach(mode=>document.getElementById(mode).addEventListener('click',()=>{document.getElementById('stage').classList.toggle('mobile',mode==='mobile');['desktop','mobile'].forEach(other=>document.getElementById(other).setAttribute('aria-pressed',String(other===mode)));}));
if(['1','2','3'].includes(location.hash.slice(1)))select(location.hash.slice(1));
</script>
</body>
</html>
