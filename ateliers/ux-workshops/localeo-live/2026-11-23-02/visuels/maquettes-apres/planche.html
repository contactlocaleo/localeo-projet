<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Maquette Localeo Live</title>
  <link rel="stylesheet" href="live.css">
  <script defer src="participation.js"></script>
  <script defer src="suivi.js"></script>
  <script defer src="programme.js"></script>
  <script defer src="planche.js"></script>
</head>
<body>
  <header class="live-header">
    <div class="brand">
      <img src="marque-localeo.png" alt="" width="38" height="38">
      <span><strong>Localeo <em>Live</em></strong><small>MAQUETTE</small></span>
    </div>
    <div class="tools" aria-label="En-tête représenté dans la maquette">
      <span class="chrome-tool"><span data-icon="bell"></span>Messages</span>
      <span class="chrome-tool"><span data-icon="menu"></span>Menu</span>
    </div>
  </header>
  <main id="screen" class="live-main"></main>
  <footer class="live-bottom">
    <nav class="live-nav" aria-label="Navigation représentée dans la maquette">
      <span data-tab="carnet"><span data-icon="book"></span>Mon carnet</span>
      <span data-tab="lots"><span data-icon="gift"></span>Mes lots</span>
      <span data-tab="discover"><span data-icon="compass"></span>Découvrir</span>
    </nav>
  </footer>
  <noscript><p>Activez JavaScript pour afficher la planche locale.</p></noscript>
</body>
</html>
